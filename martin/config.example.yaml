# Reference Martin config for non-Docker runs (Martin v0.18.x keys).
# Docker Compose uses martin/entrypoint.sh instead of this file.

listen_addresses: "0.0.0.0:3000"
worker_processes: 2
cache_size_mb: 64
preferred_encoding: gzip
web_ui: disable

postgres:
  connection_string: "postgresql://gis_user:gis_password@localhost:5432/gis_app"
  pool_size: 5
  auto_bounds: skip
  auto_publish:
    from_schemas:
      - layers_data
    tables:
      source_id_format: "{table}"
