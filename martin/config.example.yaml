# Optional Martin configuration.
#
# By default docker-compose.yml runs Martin with just a database connection
# string, which auto-discovers every spatial table (including the dynamic
# `layers_data.layer_<uuid>` tables created on shapefile upload) and publishes
# each one as a vector tile source at /<table_name>.
#
# If you need more control (restrict to a schema, tune extents/buffers, add
# functions as sources, etc.) copy this file to config.yaml, adjust it, and
# point the martin service at it instead, e.g.:
#
#   command: ["--config", "/config/config.yaml"]
#   volumes:
#     - ./martin/config.yaml:/config/config.yaml:ro

postgres:
  connection_string: "postgresql://gis_user:gis_password@db:5432/gis_app"
  auto_publish:
    from_schemas:
      - layers_data
    tables:
      source_id_format: "{table}"
