name: geolayers

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_app}
      POSTGRES_USER: ${POSTGRES_USER:-gis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - geolayers_net

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgis://${POSTGRES_USER:-gis_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_app}
    volumes:
      - media_data:/app/media
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geolayers_net

  martin:
    image: ghcr.io/maplibre/martin:v0.14.0
    restart: unless-stopped
    command:
      - "--listen-addresses"
      - "0.0.0.0:3000"
      - "postgresql://${POSTGRES_USER:-gis_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_app}"
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geolayers_net

volumes:
  postgres_data:
  media_data:

networks:
  geolayers_net:
    driver: bridge
