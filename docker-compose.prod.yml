# GeoLayers production app container.
#
# Requires the shared stack ../geo_infra (PostGIS, Martin, Nginx) to be running.
#   docker compose -f docker-compose.prod.yml up -d --build
# Public URL: http://<host>:8081 (served by the shared Nginx; this container publishes no ports).
name: geolayers

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MARTIN_INTERNAL_URL: http://martin:3000
    volumes:
      - media_data:/app/media
    networks:
      geo_shared:
        aliases:
          - geolayers_web

volumes:
  media_data:

networks:
  geo_shared:
    external: true
