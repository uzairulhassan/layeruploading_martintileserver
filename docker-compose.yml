# GeoLayers app container (local development; bind-mounts the source).
#
# PostgreSQL/PostGIS, Martin and Nginx live in the shared stack ../geo_infra.
# Start it first (creates the external `geo_shared` network):
#   cd ../geo_infra && docker compose up -d
#
# Public URL: http://localhost:8081 (via shared Nginx).
# Production: use docker-compose.prod.yml instead.
services:
  web:
    build: .
    env_file: .env
    environment:
      MARTIN_INTERNAL_URL: http://martin:3000
    volumes:
      - .:/app
      - media_data:/app/media
    restart: unless-stopped
    networks:
      geo_shared:
        aliases:
          - geolayers_web

volumes:
  media_data:

networks:
  geo_shared:
    external: true
