services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gis_app
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgis://gis_user:gis_password@db:5432/gis_app
      MARTIN_INTERNAL_URL: http://martin:3000
      # On-demand Martin restart (no continuous catalog polling)
      MARTIN_DOCKER_CONTAINER: geolayers-martin
    volumes:
      - .:/app
      - media_data:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      martin:
        condition: service_started

  martin:
    image: ghcr.io/maplibre/martin:v0.18.1
    container_name: geolayers-martin
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    environment:
      MARTIN_DATABASE_URL: postgresql://gis_user:gis_password@db:5432/gis_app
      MARTIN_CACHE_MB: "64"
      MARTIN_POOL_SIZE: "5"
      MARTIN_WORKERS: "2"
    volumes:
      - ./martin/entrypoint.sh:/config/entrypoint.sh:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Soft RAM hint for Docker (does not hard-kill; helps scheduling on small VPS)
    mem_limit: 256m

volumes:
  postgres_data:
  media_data:
