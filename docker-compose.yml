# GeoLayers app container (local development; bind-mounts the source).
#
# PostgreSQL/PostGIS, Martin and Nginx live in the shared stack ../geo-infra.
# Start it first (it creates the external `geo_shared` network):
#   cd ../geo-infra && docker compose up -d
# The app is served through Nginx on :8081 (GEOLAYERS_HTTP_PORT). Nginx resolves
# this container by its network alias `geolayers_web`.
services:
  web:
    build: .
    env_file: .env
    environment:
      MARTIN_INTERNAL_URL: http://martin:3000
    volumes:
      - .:/app
      - media_data:/app/media
    restart: unless-stopped
    networks:
      geo_shared:
        aliases:
          - geolayers_web

volumes:
  media_data:

networks:
  geo_shared:
    external: true
