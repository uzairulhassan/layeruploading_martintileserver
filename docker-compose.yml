services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gis_app
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgis://gis_user:gis_password@db:5432/gis_app
    volumes:
      - media_data:/app/media
    ports:
      - "6000:6000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
