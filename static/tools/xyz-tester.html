<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ Layer Tester · GeoTrak Layers</title>
<link rel="icon" href="/static/images/geotrak-browser-icon.png?v=2" type="image/png" sizes="32x32">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root {
    --navy: #0f2d53;
    --navy-hover: #0a2140;
    --navy-muted: rgba(15, 45, 83, 0.58);
    --navy-faint: rgba(15, 45, 83, 0.07);
    --navy-line: rgba(15, 45, 83, 0.14);
    --navy-line-strong: rgba(15, 45, 83, 0.28);
    --white: #ffffff;
    --danger: #b42318;
    --danger-soft: rgba(180, 35, 24, 0.08);
    --good: #1f8f5f;
    --good-soft: rgba(31, 143, 95, 0.1);
    --radius: 2px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    color: var(--navy);
    display: flex;
    flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--navy-line);
    background: var(--white);
  }
  header h1 {
    margin: 0 0 0.65rem;
    font-size: 1rem;
    font-weight: 700;
  }
  header h1 .muted { font-weight: 400; color: var(--navy-muted); }

  form#controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 0.25rem; }
  .field label {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--navy-muted);
  }
  .field input, .field select {
    padding: 0.45rem 0.55rem;
    border: 1px solid var(--navy-line-strong);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--navy);
    background: var(--white);
    font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--navy); }
  #mapbox-token { width: 15rem; }
  #xyz-url { width: 28rem; max-width: 42vw; }
  #source-layer { width: 11rem; }

  button {
    padding: 0.5rem 1rem;
    border: 1px solid var(--navy);
    border-radius: var(--radius);
    background: var(--navy);
    color: var(--white);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--navy-hover); border-color: var(--navy-hover); }
  button.secondary { background: transparent; color: var(--navy); }
  button.secondary:hover { background: var(--navy-faint); }

  #status {
    margin-top: 0.55rem;
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
    border-radius: var(--radius);
    display: none;
  }
  #status.is-visible { display: block; }
  #status.ok { background: var(--good-soft); color: var(--good); }
  #status.error { background: var(--danger-soft); color: var(--danger); }

  main { flex: 1 1 auto; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }

  #placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #eef1f5; color: var(--navy-muted); font-size: 0.9rem; text-align: center; padding: 2rem;
  }
</style>
</head>
<body>
  <header>
    <h1>XYZ Layer Tester <span class="muted">— Mapbox base map + a swappable XYZ/MVT overlay</span></h1>
    <form id="controls">
      <div class="field">
        <label for="mapbox-token">Mapbox access token</label>
        <input type="text" id="mapbox-token" placeholder="pk.eyJ1Ijoi…" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="xyz-url">XYZ URL template</label>
        <input type="text" id="xyz-url" placeholder="https://host/x/&lt;token&gt;/{z}/{x}/{y}.pbf" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="source-layer">Source layer</label>
        <input type="text" id="source-layer" placeholder="e.g. layer_ab12cd34" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="geom-type">Render as</label>
        <select id="geom-type">
          <option value="fill">Polygon (fill)</option>
          <option value="line">Line</option>
          <option value="circle">Point (circle)</option>
        </select>
      </div>
      <button type="submit" id="apply-btn">Apply</button>
      <button type="button" id="clear-btn" class="secondary">Remove layer</button>
    </form>
    <div id="status"></div>
  </header>

  <main>
    <div id="map"></div>
    <div id="placeholder">Enter a Mapbox token above to load the base map.</div>
  </main>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "xyz-tester:v1";
  var SOURCE_ID = "xyz-test-source";
  var LAYER_ID = "xyz-test-layer";

  var tokenInput = document.getElementById("mapbox-token");
  var urlInput = document.getElementById("xyz-url");
  var sourceLayerInput = document.getElementById("source-layer");
  var geomSelect = document.getElementById("geom-type");
  var statusBox = document.getElementById("status");
  var placeholder = document.getElementById("placeholder");
  var map = null;

  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      tokenInput.value = saved.token || "";
      urlInput.value = saved.url || "";
      sourceLayerInput.value = saved.sourceLayer || "";
      geomSelect.value = saved.geomType || "fill";
    } catch (err) { /* ignore corrupt/blocked storage */ }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        token: tokenInput.value.trim(),
        url: urlInput.value.trim(),
        sourceLayer: sourceLayerInput.value.trim(),
        geomType: geomSelect.value,
      }));
    } catch (err) { /* private mode / storage disabled — non-fatal */ }
  }

  function showStatus(message, kind) {
    statusBox.textContent = message;
    statusBox.className = "is-visible " + (kind || "");
  }

  function clearStatus() {
    statusBox.className = "";
    statusBox.textContent = "";
  }

  function paintForGeometry(type) {
    if (type === "line") {
      return { type: "line", paint: { "line-color": "#0F2D53", "line-width": 2 } };
    }
    if (type === "circle") {
      return { type: "circle", paint: { "circle-color": "#0F2D53", "circle-radius": 5, "circle-stroke-color": "#fff", "circle-stroke-width": 1 } };
    }
    return { type: "fill", paint: { "fill-color": "#0F2D53", "fill-opacity": 0.45, "fill-outline-color": "#0a2140" } };
  }

  function removeXyzLayer() {
    if (!map) return;
    if (map.getLayer(LAYER_ID)) map.removeLayer(LAYER_ID);
    if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);
  }

  function addXyzLayer() {
    var url = urlInput.value.trim();
    var sourceLayer = sourceLayerInput.value.trim();

    removeXyzLayer();
    if (!url) return;

    if (!sourceLayer) {
      showStatus("Enter the source-layer name (the table/layer id inside the tiles) to render the XYZ layer.", "error");
      return;
    }
    if (!/\{z\}.*\{x\}.*\{y\}/.test(url)) {
      showStatus("URL should contain {z}/{x}/{y} placeholders.", "error");
      return;
    }

    map.addSource(SOURCE_ID, { type: "vector", tiles: [url], minzoom: 0, maxzoom: 22 });
    var style = paintForGeometry(geomSelect.value);
    map.addLayer({
      id: LAYER_ID,
      type: style.type,
      source: SOURCE_ID,
      "source-layer": sourceLayer,
      paint: style.paint,
    });
    showStatus("Layer added. Watching for tile errors…", "ok");
  }

  function initMap() {
    var token = tokenInput.value.trim();
    if (!token) {
      placeholder.style.display = "flex";
      return;
    }
    placeholder.style.display = "none";

    if (map) {
      addXyzLayer();
      return;
    }

    mapboxgl.accessToken = token;
    map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/streets-v12",
      center: [0, 20],
      zoom: 2,
    });
    map.addControl(new mapboxgl.NavigationControl(), "top-right");

    map.on("load", addXyzLayer);

    map.on("error", function (e) {
      var status = e && e.error && (e.error.status || e.error.statusCode);
      if (status === 403) showStatus("Tile request blocked (403) — this share link may have been blocked by an admin.", "error");
      else if (status === 410) showStatus("Tile request gone (410) — this share link has expired.", "error");
      else if (status === 404) showStatus("Tile request not found (404) — check the share link/token.", "error");
      else if (e && e.error) showStatus("Tile error: " + (e.error.message || status || "unknown"), "error");
    });
  }

  document.getElementById("controls").addEventListener("submit", function (event) {
    event.preventDefault();
    clearStatus();
    saveState();
    initMap();
  });

  document.getElementById("clear-btn").addEventListener("click", function () {
    urlInput.value = "";
    saveState();
    removeXyzLayer();
    clearStatus();
  });

  loadSaved();
  if (tokenInput.value.trim()) initMap();
})();
</script>
</body>
</html>
