{% extends "registration/base_auth.html" %}
{% load static %}
{% block title %}Initial setup · GeoLayers{% endblock %}
{% block auth_panel %}
<p class="auth-kicker">One-time setup</p>
<h1>Create Admin</h1>
<p class="auth-lede">Set up the first administrator for this instance.</p>

<form
  id="register-form"
  class="auth-form"
  data-endpoint="/api/auth/onetime/"
  data-fail-message="Setup failed."
  novalidate
>
  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus autocomplete="username" maxlength="150" placeholder="Choose a username">
    <div id="username-status" class="field-hint" aria-live="polite"></div>
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@example.com">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
  </div>
  <div class="form-group">
    <label for="password_confirm">Confirm password</label>
    <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8" placeholder="Repeat password">
  </div>
  <div id="register-error" class="error-text hidden" role="alert"></div>
  <button type="submit" id="register-submit" class="btn btn-primary btn-block auth-submit">Create Admin</button>
</form>
{% endblock %}
{% block auth_scripts %}
<script src="{% static 'js/register_form.js' %}"></script>
{% endblock %}
