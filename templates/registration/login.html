{% extends "registration/base_auth.html" %}
{% load static %}
{% block title %}Sign In · GeoTrak Layers{% endblock %}
{% block auth_panel %}
<p class="auth-kicker">Welcome back</p>
<h1>Sign in</h1>
<p class="auth-lede">Continue with your username or email.</p>

<form id="login-form" class="auth-form">
  <div class="form-group">
    <label for="username">Username or email</label>
    <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
  </div>
  <button type="submit" class="btn btn-primary btn-block auth-submit">Sign in</button>
</form>

<p class="auth-footer">
  No account yet? <a href="{% url 'core:signup' %}">Create one</a>
</p>
{% endblock %}
{% block auth_scripts %}
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
