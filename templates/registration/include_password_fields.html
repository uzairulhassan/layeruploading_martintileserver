<div class="form-group">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" placeholder="Create a strong password" aria-describedby="password-strength password-rules">
  <div id="password-strength" class="password-strength" hidden>
    <div class="password-strength-track" aria-hidden="true">
      <span class="password-strength-bar"></span>
    </div>
    <p class="password-strength-label"></p>
  </div>
  <ul id="password-rules" class="password-rules" aria-live="polite">
    <li data-rule="length">At least 8 characters</li>
    <li data-rule="letter">At least 1 letter</li>
    <li data-rule="digit">At least 1 number</li>
    <li data-rule="special">At least 1 special character (@, $, !, #…)</li>
  </ul>
</div>
<div class="form-group">
  <label for="password_confirm">Confirm password</label>
  <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8" placeholder="Repeat password">
  <div id="password-match" class="field-hint" aria-live="polite"></div>
</div>
