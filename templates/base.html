{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GeoLayers{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if user.is_authenticated %}
  <header class="topbar">
    <a class="brand" href="{% url 'core:dashboard' %}">GeoLayers</a>

    <nav class="topbar-nav" aria-label="Main">
      <a href="{% url 'core:dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="is-active"{% endif %}>Dashboard</a>
      <a href="{% url 'core:layer_list' %}" {% if request.resolver_match.url_name == 'layer_list' %}class="is-active"{% endif %}>Layers</a>
      <a href="{% url 'core:map_list' %}" {% if request.resolver_match.url_name == 'map_list' or request.resolver_match.url_name == 'map_new' or request.resolver_match.url_name == 'map_builder' %}class="is-active"{% endif %}>Maps</a>
    </nav>

    <div class="user-menu">
      <button
        type="button"
        id="profile-menu-btn"
        class="profile-btn"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="profile-menu"
        aria-label="Account menu"
        title="Account"
      >
        <span class="profile-avatar" aria-hidden="true">{{ user.username|slice:":2"|upper }}</span>
        <span class="profile-meta">
          <span class="profile-meta-name">{{ user.username }}</span>
          {% if user.email %}<span class="profile-meta-email">{{ user.email }}</span>{% endif %}
        </span>
      </button>

      <div id="profile-menu" class="profile-dropdown hidden" role="menu">
        <span class="profile-menu-item is-static" role="none">My Account</span>
        <button type="button" id="logout-btn" class="profile-menu-item is-danger" role="menuitem">Sign out</button>
      </div>
    </div>
  </header>
  {% endif %}

  <main class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/auth.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
