<div class="theme-menu" data-theme-picker>
  <button
    type="button"
    class="theme-btn"
    data-theme-trigger
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="theme-menu"
    title="Theme"
    aria-label="Choose theme"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 3.75v16.5A8.25 8.25 0 0 0 12 3.75Z" fill="currentColor"/>
    </svg>
  </button>
  <div id="theme-menu" class="theme-dropdown hidden" data-theme-menu role="menu" aria-label="Themes">
    <p class="theme-menu-label">Theme</p>
    <div class="theme-option-list" data-theme-list role="group" aria-label="Available themes"></div>
  </div>
</div>

<div class="user-menu">
  <button
    type="button"
    id="profile-menu-btn"
    class="profile-btn"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="profile-menu"
    aria-label="Account menu"
    title="Account"
  >
    <span class="profile-avatar{% if user.avatar %} has-image{% endif %}" id="header-avatar" aria-hidden="true">
      {% if user.avatar %}
      <img src="{{ user.avatar.url }}" alt="">
      {% else %}
      {{ user.username|slice:":2"|upper }}
      {% endif %}
    </span>
    <span class="profile-meta">
      <span class="profile-meta-name">{{ user.username }}</span>
      {% if user.email %}<span class="profile-meta-email">{{ user.email }}</span>{% endif %}
    </span>
    <svg class="profile-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 9.5 12 15.5 18 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div id="profile-menu" class="profile-dropdown hidden" role="menu">
    <a href="{% url 'core:account' %}" class="profile-menu-item" role="menuitem">My Account</a>
    <a href="{% url 'core:security' %}" class="profile-menu-item" role="menuitem">Security</a>
    <button type="button" id="logout-btn" class="profile-menu-item is-danger" role="menuitem">Sign out</button>
  </div>
</div>
